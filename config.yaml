# PetClinic-Evolve configuration.
# Fill in the two branch base refs and the hotspot method names, then smoke-test
# with --dry-run and --max-checkpoints 1.

model: claude-opus-4-8         # the fixed coding agent. Override per run with --model
                              # (e.g. --model claude-opus-5) to reproduce with a different
                              # AI; see docs/RUN_WITH_A_DIFFERENT_MODEL.md. Recorded in
                              # provenance.json either way, so a run is self-describing.
chains: 10                    # independent runs per (arm, strategy). 10 = target for tight CIs.
active_strategy: just-solve   # which prompt strategy to run by default
agent_timeout: 3600

# Resilience. On a TOKEN/SESSION limit the harness rolls back the current
# checkpoint, waits for the window to reopen, then retries the SAME checkpoint --
# so an overnight pause resumes exactly where it left off. TRANSIENT failures
# (internet dropping in/out, the API overloaded, no completion) are treated the
# same way but with a short exponential backoff instead of a quota-reset wait.
limits:
  # token/session limit
  poll_seconds: 1800        # wait between retries when the reset time can't be parsed (30 min)
  max_sleep_seconds: 21600  # cap on a single quota-reset wait (6 h), then re-check
  # transient failures (network / overload / no completion)
  retry_backoff_seconds: 60     # first backoff; doubles each consecutive transient failure
  retry_backoff_max: 900        # cap on a single transient backoff (15 min)
  max_transient_attempts: 20    # consecutive transient failures before aborting (network truly down)
  # overall
  max_attempts: 500         # absolute safety cap on retries per checkpoint

# Paths below that are NOT absolute are resolved relative to THIS config file's
# directory, so the harness can be moved without editing them.
checkpoints_file: checkpoints.yaml

# Acceptance criteria are injected PER CHECKPOINT (never pre-committed to the base
# branch), so the agent only ever sees the current + prior requirements' tests,
# never future ones. At checkpoint K the harness copies Cp{K}Tests.java (plus the
# shared infra at K=1) into the worktree and commits it as "test: add cpK ...".
acceptance:
  src_dir: acceptance/src/test/java/org/springframework/samples/petclinic/acceptance
  dest_subpath: src/test/java/org/springframework/samples/petclinic/acceptance
  shared: ["AcceptanceBase.java", "AuditLogCapture.java"]   # injected at checkpoint 1

arms:
  spring:
    repo: ${HOME}/compare/spring       # ${VARS} and ~ are expanded from the environment
    base_ref: spring-compare-no-tests  # app + injected acceptance suite only; no pre-existing tests
    source_globs: ["src/main/java/**/*.java"]
    verbosity_dirs: ["src/main/java"]
    yaml_globs: []                       # Spring has no endpoint YAML
    # Hotspot + scoped erosion use a DYNAMIC subsystem: the production-Java files
    # changed since base_ref (cumulative). A new class the agent creates is in
    # that diff, so it can't hide — no fixed hotspot config needed.
    function_package_glob: null          # N/A for Spring
    # Entry-handler trajectory (#4): the ONE function POST /api/owners routes
    # through. Regex over '<file>::<name>'. Spring's single handler can bloat.
    entry_handler: "OwnerRestControllerV1::addOwner"
    # No wiring file: Spring declares no per-rule nodes, so its single node IS the entry
    # handler and `node_closure_cc_median` is the whole handler's closure. That is the
    # measurement -- an arm earns multiple nodes only by having separable rules.
    node_roots: null

  officefloor:
    repo: ${HOME}/compare/officefloor
    base_ref: officefloor-compare-no-tests  # app + injected acceptance suite only; no pre-existing tests
    source_globs: ["src/main/java/**/*.java"]
    verbosity_dirs: ["src/main/java"]
    yaml_globs: ["src/main/resources/officefloor/**/*.yml"]
    # Same dynamic touched-file subsystem as Spring (so the hotspot catches any
    # bloat wherever it lands). OfficeFloor's own wired functions are also tracked
    # separately via function_package_glob (fn_count / fn_nloc_max).
    function_package_glob: "src/main/java/**/rest/function/**/*.java"
    # Designated create-entry function of the owner pipeline. Expected to stay
    # flat: new rules attach as NEW wired functions, not by growing this one.
    # NOTE: entry_cc / wmc_handler / erosion_handler all scope to this ONE node, so a
    # pipeline can look flat on them by pushing work downstream (it measurably does:
    # entry CC ~1.3 while the worst pipeline node reaches ~13). Use `node_closure_*`
    # for the relocation-proof comparison.
    entry_handler: "BuildOwner::service"
    # Per-node comprehension load: every wired step of the create pipeline is a node,
    # read from the declared wiring. Each node's transitive call closure is measured,
    # so logic moved to a later node simply lands in that node's number.
    node_roots:
      wiring_file: "src/main/resources/officefloor/rest/api/owners.POST.yml"
      class_regex: 'class:\s*([\w.]+)'
      node_method: "service"

# Prompt strategies mirror SlopCodeBench's intervention study. {spec} is replaced
# with the checkpoint specification. Keep them neutral: never mention the
# experiment, the architecture, or "refactor" in just-solve.
prompt_strategies:
  just-solve: |
    Implement the following change to the application so that it fully satisfies
    the specification and all existing and new tests pass. Run the test suite and
    make it green before finishing.

    {spec}
  anti_slop: |
    Implement the following change. Do not add verbose or defensive code,
    unnecessary abstractions, or duplicated logic. Group code by responsibility
    and avoid growing any single "god" method or function. Make all tests pass.

    {spec}
  plan_first: |
    First outline your approach in a few bullet points. Then implement the
    simplest solution that satisfies the specification, verify the edge cases,
    and refactor if needed. Make all tests pass before finishing.

    {spec}
  # The IMPLEMENT prompt for the impact_gated pipeline. Unlike just-solve, it gives the AI
  # the EXACT structural-impact formula as its objective (a clear measurable target, not
  # "write good code"). The contrast with just-solve is the whole point: does a precise,
  # measurable objective plus the gate+refactor loop let good prompting keep the code clean,
  # or does the eroding architecture concentrate complexity anyway. Keep this formula in sync
  # with the refactor_prompt and the impact_stats measure.
  impact_gated: |
    Implement the following change to the application so that it fully satisfies the
    specification and all existing and new tests pass.

    Write it to keep structural impact low. Structural impact is a measurable cost, not a
    vague goal. For every function you change, the cost is:
        cost = max(WMC_other, 1) * CC * max(1, changed_lines)
    CC is that function's cyclomatic complexity. WMC_other is the summed cyclomatic
    complexity of the OTHER methods in its class, which is the surrounding context you must
    hold to edit it safely. changed_lines is how many of its lines you add or edit. The costs
    are summed over every function you change, then multiplied by the number of files you
    touch. So the biggest lever is WMC_other: a method inside a large class pays for the whole
    class. Do not grow one method or one class. Add behaviour as small, cohesive units, each
    with little surrounding complexity, and keep every function you change simple.

    Run the test suite and make it green before finishing.

    {spec}

# --- ImpactGate pipeline (the impact_gated strategy) --------------------------------
# When the active strategy == impact_gate.strategy, each checkpoint runs a control loop:
# the agent implements the change, the staged production diff is scored by the standalone
# `impact-gate` CLI against its Java seed distribution (--curve), and a change graded at or
# above block_percentile is DISCARDED. A refactor turn then runs on the clean pre-change
# code, told which classes ImpactGate flagged AND what change is coming, and is committed as
# `cpNN refactorM <id>`; the change is re-attempted on top of it. Up to max_refactors
# refactors; still blocked after the last stops the chain (a clean-code failure). ImpactGate
# is only MEASURED on the refactor, never gates it. The measure is the same before-context
# WMC that analyze reports as impact_composite, so the gate gates exactly the erosion signal.
impact_gate:
  # How to invoke the standalone impact-gate CLI. Each element is ${HOME}/~/$VAR-expanded.
  # Default points at the sibling ImpactGate checkout's venv; set to ["impact-gate"] if it
  # is installed on PATH / into this harness's .venv (pip install -e ~/ImpactGate).
  # NOTE: whichever venv this points at supplies the LIZARD that decides every verdict, and it
  # must be the same version this harness uses (requirements.txt pins lizard==1.23.0; 1.24.0
  # parses @Entity/@Table classes as zero functions, so changes to them score 0 and can never
  # fail the gate). run_experiment refuses to start if it cannot see them — harness/parser_selftest.py.
  cmd: ["${HOME}/ImpactGate/.venv/bin/impact-gate"]
  strategy: impact_gated      # the prompt-strategy name that activates this loop
  # Grade each change against a REFERENCE DISTRIBUTION, not ImpactGate's generic OSS seed.
  # The prior run (blog.officefloor.net "The same complexity: one unit or twenty?") showed
  # OfficeFloor spreads work into many small wired functions and does NOT erode into god
  # classes. So the experiment now asks: can the refactor prompting hold Spring (one growing
  # @RestController) to OfficeFloor's cohesion? Calibrate the gate to OfficeFloor's OWN
  # observed impact_composite distribution (build it with harness.build_impact_baseline) and
  # grade every change against it. With curve_prior_weight: 0 the grade is PURELY that
  # distribution's percentile (the seed is ignored), so block_percentile is read against the
  # reference arm: "block_percentile 90" == refactor when a change is more impactful than 90%
  # of OfficeFloor's changes. Leave baseline_file null to fall back to the seed curve instead.
  #
  # From run blind-202608100006, OfficeFloor/just-solve impact_composite (n=549):
  #   P50=369  P75=1,412  P90=3,410  P95=5,922  P98=14,148  max=114,009
  # Spring's median change (4,736) already exceeds OF's P90, so the block choice sets how hard
  # Spring must fight: block_percentile 90 -> ~61% of Spring changes trigger a refactor;
  # 95 -> ~45%; 98 -> ~30%. Lower = held to OF's TYPICAL cohesion (strict, early stops likely);
  # higher = only Spring's worst concentrations are gated (lenient). SMOKE-RUN and tune via the
  # "impact-gate: implement grade pXX" log line.
  # Reference distribution, committed IN THIS REPO so it travels with a checkout (it is a run
  # INPUT, like ImpactGate's seed, not derived output. The source run's evolve branches ARE on
  # GitHub, but a fresh clone leaves them as remote-tracking refs while analyze reads local
  # refs/heads/evolve, so rebuilding means fetching those heads locally then a slow recompute;
  # committing the 4KB file keeps the config self-contained. Relative, so main() anchors it to
  # this config's dir and passes an ABSOLUTE path to impact-gate (kept outside the arm worktree,
  # never seen by the agent). Rebuild with harness.build_impact_baseline. null -> generic seed.
  baseline_file: baselines/officefloor.json
  curve_prior_weight: 0       # 0 = grade PURELY vs baseline_file (ignore the seed); K in n/(n+K)
  # SHARED cutoff applied identically to BOTH arms (run --strategy impact_gated with no --arm
  # filter). p95 of OfficeFloor == composite ~5,922: each change must stay under that. OfficeFloor
  # fires on ~5% of its own changes (its tail), Spring on ~45%, held to OfficeFloor's cohesion
  # without being impossible to pass. Raise toward p98 (~14,148) for more headroom, lower toward
  # p90 (~3,410) for OfficeFloor's typical cohesion (stricter, earlier stops likely).
  block_percentile: 95        # read against the reference distribution (see numbers above)
  warn_percentile: 85         # reported only (the gate keys off block_percentile)
  max_refactors: 3            # refactors allowed per checkpoint before the chain stops
  stop_scope: chain           # chain = stop this chain, keep running other arms/chains; run = abort all
  record_refactor_correctness: true  # run the full gate on each refactor (record only; not enforced)
  measure_config: null        # optional Surveyor-style ignore-globs YAML for impact-gate
  # The REFACTOR prompt. Placeholders: {spec} the upcoming change, {files} the flagged files,
  # {drivers} the specific methods/classes driving the cost, {grade}/{block} the percentiles.
  refactor_prompt: |
    A change is about to be made to this codebase. Implementing it directly would concentrate
    too much structural complexity. Before that change is made, refactor the code so the
    change can land cleanly. Do NOT implement the change itself in this step.

    The upcoming change (do not implement it now, only prepare for it):
    {spec}

    How structural impact is measured. This is the exact objective, and lower is better.
    For every function the upcoming change touches, the cost is:
        cost = max(WMC_other, 1) * CC * max(1, changed_lines)
    where
        CC            = the cyclomatic complexity of that function
        WMC_other     = the summed cyclomatic complexity of the OTHER methods in that
                        function's class, the surrounding context you must hold to edit it
        changed_lines = how many of that function's lines the change adds or edits
    The costs are summed over every changed function, then multiplied by the number of files
    the change touches. A brand new class costs 1 * CC * size * files.

    The dominant lever is WMC_other. A method inside a large class pays for the whole class.
    Splitting one large class into several small, cohesive classes lowers WMC_other for every
    method, which lowers the cost of the upcoming change.

    ImpactGate scored the upcoming change over the line (grade p{grade}, it must come under
    p{block}). These files carry the highest cost:
    {files}

    The specific methods and classes driving the cost:
    {drivers}

    Refactor to reduce that cost. Break large methods and classes into smaller, more cohesive
    units. Extract collaborators. Remove duplication. The goal is that the upcoming change
    touches small focused units, each with a small surrounding class, instead of one growing
    god method or god class. Preserve all existing behaviour exactly. Every current test must
    still pass. Run the tests and make them green before finishing.

build:
  # Compile step used as the build gate (fast; tests run separately by tag).
  cmd: ["./mvnw", "-q", "-B", "-DskipTests", "test-compile"]
  # {tags} is replaced with "cp01,cp02,...,cpK" (JUnit5 tag include = OR).
  test_cmd_template: ["./mvnw", "-q", "-B", "-Dgroups={tags}", "test"]
  surefire_dir: "target/surefire-reports"
  timeout: 1800
  test_timeout: 3600
  # Gate retries. ONLY an ABORTED run is retried (Surefire fork crash / JVM SIGABRT,
  # which yields no verdict and would otherwise be scored as "every prior rule broke").
  # A run whose tests merely FAIL is never retried -- that is the signal being measured.
  test_attempts: 3          # tries per gate before the checkpoint is marked gate_invalid
  test_retry_seconds: 30    # pause between those tries

tools:
  jscpd: "jscpd"     # npm i -g jscpd  (clone detection for Verbosity)
  astgrep: "sg"      # ast-grep binary  (pattern flags for Verbosity)
  astgrep_rules: "astgrep-rules"

probe:
  enabled: true
  at_checkpoints: [1, 10, 20, 30, 40, 50, 60]   # cold-reader probe every 10 checkpoints
  question: |
    Read the code as it currently stands and answer without changing anything.
    List, in order, every validation and side-effect that is applied when
    creating an owner via POST /api/owners.
  # Ground-truth items for a crude recall score (case-insensitive substring match;
  # grade properly offline too). Single distinctive tokens for the create-owner
  # rules, so casing/spacing (e.g. "displayName" vs "display name") doesn't matter.
  # Spans the full cp1-60 stream: at an early probe only the rules implemented so
  # far can match, so the denominator is shared and the score rises over the run.
  # The absolute value is rough; the Spring-vs-OfficeFloor gap at each probe is the
  # signal (same denominator, same checkpoint, both arms).
  expected:
    # cp1-20 rule web
    - "duplicate"       # exact / household / telephone / email uniqueness
    - "telephone"       # normalisation + uniqueness + E.164
    - "email"           # email presence / format / uniqueness
    - "display"         # displayName
    - "initials"        # initials
    - "registration"    # registrationDate default + business day
    - "membership"      # membershipNumber
    - "customer"        # customerCode
    - "city"            # canonical casing + per-city sequence + capacity
    - "namesake"        # namesakeCount
    - "household"       # sharesHousehold / householdId
    - "local"           # locality
    - "audit"           # audit trail
    # cp21-40 identity, limits, membership maths
    - "bulk"            # bulkSignupWarning
    - "gold"            # GOLD tier before numeric levels
    - "level"           # membershipLevel (numeric, then points)
    - "country"         # country-specific telephone length
    - "preference"      # contactPreference
    - "identity"        # identityKey
    - "postcode"        # postcode validation
    - "luhn"            # customerCode check digit
    - "hash"            # SHA-256 region-and-hash identity
    - "future"          # reject future registrationDate
    - "age"             # ageBand
    - "possible"        # possibleDuplicate soft-match
    - "blocklist"       # disposable email-domain blocklist
    - "tenure"          # tenure gate on top level
    - "points"          # membershipPoints
    # cp41-60 collisions, structure, fiscal, v2
    - "collision"       # customerCode / memberId de-duplication
    - "timezone"        # region-to-timezone
    - "title"           # salutation from title
    - "deleted"         # exclude deleted owners from checks
    - "holiday"         # public-holiday business-day roll-forward
    - "fiscal"          # fiscal-year basis
    - "idempotency"     # Idempotency-Key replay
    - "soundex"         # identityKey v2 soundex(lastName)
    - "segment"         # ownerSegment
    - "capacity"        # capacityWarning approaching city limit
    - "risk"            # riskFlag
    - "problem"         # RFC7807 problem+json rejections
    - "version"         # apiVersion / schemaVersion v2 finale

# Kept identical at every checkpoint. CLAUDE.md is the fixed, human-authored
# project guide (present in BOTH arms so the playing field is level: it offsets
# Spring's training-data advantage for OfficeFloor). Pinning restores it to the
# base_ref version after each agent turn, so it can never become accumulating
# cross-checkpoint memory. The CSV `notes` column flags any checkpoint where the
# agent tried to edit it.
isolation:
  pin_files: ["CLAUDE.md"]

  # Filesystem confinement for the agent turn (Linux Landlock; no root/bwrap). The
  # blind-agent design removes the withheld tests from the sandbox and git history,
  # but the agent process could still `find /` the rest of the disk — reaching the
  # harness acceptance/ suite, checkpoints.yaml, and prior runs left in Trash. With
  # this on, the agent (and every child it spawns) is restricted to the sandbox +
  # toolchain; everything else returns EACCES. Fails CLOSED: if Landlock is missing
  # or the sentinel self-check finds withheld material readable, the turn is refused.
  # Verify support with:  python harness/landlock_selftest.py   (expect OVERALL: PASS)
  agent_confinement:
    enabled: true
    extra_ro_binds: []   # extra read-only paths (toolchain not under /usr,/opt,~/.local)
    extra_rw_binds: []   # extra writable paths (e.g. an alternate Maven repo)

paths:
  # work_root holds the per-chain git WORKTREES (production tree + .git history +
  # capture staging), under <work_root>/<run_id>/<arm>-<strategy>-chain<n>.
  #
  # sandbox_root IS the agent's sandbox directory itself: the project contents are
  # mirrored directly under it, so its cwd looks like an ordinary project dir (e.g.
  # named "sandbox") with NOTHING in the path — no run_id/arm/strategy/chain — that
  # could hint at a checkpoint sequence. It is reused across chains (which run
  # sequentially) and rebuilt fresh each turn; the harness deletes it wholesale, so it
  # MUST be a dedicated directory (a home/root path is refused).
  #
  # Both MUST be absolute, EXTERNAL, and SEPARATE from each other (${VARS} and ~ are
  # expanded; a relative path would be anchored inside this repo). Why: the agent's cwd
  # is the sandbox. If it were a child of work_root (or of this repo), the agent could
  # `cd ..` into a worktree and read its .git history (the cp01/cp02… sequence), the
  # experimenter's acceptance/ suite, checkpoints.yaml, and all future specs — defeating
  # the blind-agent isolation (observed once at cp60). A separate, flat sandbox_root
  # gives the agent a tree with no worktree/.git/capture siblings to walk into.
  work_root: ${HOME}/pe-work
  sandbox_root: ${HOME}/sandbox
  results_csv: results/records.csv
