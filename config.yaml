# PetClinic-Evolve configuration.
# Fill in the two branch base refs and the hotspot method names, then smoke-test
# with --dry-run and --max-checkpoints 1.

model: claude-opus-4-8
chains: 5                     # independent runs per (arm, strategy). >=5.
active_strategy: just-solve   # which prompt strategy to run by default
agent_timeout: 3600

checkpoints_file: /home/daniel/compare/petclinic-evolve/checkpoints.yaml

arms:
  spring:
    repo: /home/daniel/spring-petclinic-rest
    # A commit/tag on spring-compare BEFORE the 20 owner-lifecycle features,
    # but WITH all cp01..cp20 acceptance tests already present (they fail until
    # implemented). Create it once, e.g.:  git tag evolve-base-spring
    base_ref: evolve-base-spring
    source_globs: ["src/main/java/**/*.java"]
    verbosity_dirs: ["src/main/java"]
    yaml_globs: []                       # Spring has no endpoint YAML
    # The method(s) new owner behaviour naturally accretes into:
    hotspot:
      file: "rest/controller/v1/OwnerRestControllerV1.java"
      methods: ["addOwner", "updateOwner"]
    function_package_glob: null          # N/A for Spring

  officefloor:
    repo: /home/daniel/spring-petclinic-rest
    base_ref: evolve-base-officefloor
    source_globs: ["src/main/java/**/*.java"]
    verbosity_dirs: ["src/main/java"]
    yaml_globs: ["src/main/resources/officefloor/**/*.yml"]
    hotspot: null                        # no single hotspot; behaviour is fanned out
    function_package_glob: "src/main/java/**/rest/function/**/*.java"

# Prompt strategies mirror SlopCodeBench's intervention study. {spec} is replaced
# with the checkpoint specification. Keep them neutral: never mention the
# experiment, the architecture, or "refactor" in just-solve.
prompt_strategies:
  just-solve: |
    Implement the following change to the application so that it fully satisfies
    the specification and all existing and new tests pass. Run the test suite and
    make it green before finishing.

    {spec}
  anti_slop: |
    Implement the following change. Do not add verbose or defensive code,
    unnecessary abstractions, or duplicated logic. Group code by responsibility
    and avoid growing any single "god" method or function. Make all tests pass.

    {spec}
  plan_first: |
    First outline your approach in a few bullet points. Then implement the
    simplest solution that satisfies the specification, verify the edge cases,
    and refactor if needed. Make all tests pass before finishing.

    {spec}

build:
  # Compile step used as the build gate (fast; tests run separately by tag).
  cmd: ["./mvnw", "-q", "-B", "-DskipTests", "test-compile"]
  # {tags} is replaced with "cp01,cp02,...,cpK" (JUnit5 tag include = OR).
  test_cmd_template: ["./mvnw", "-q", "-B", "-Dgroups={tags}", "test"]
  surefire_dir: "target/surefire-reports"
  timeout: 1800
  test_timeout: 3600

tools:
  jscpd: "jscpd"     # npm i -g jscpd  (clone detection for Verbosity)
  astgrep: "sg"      # ast-grep binary  (pattern flags for Verbosity)
  astgrep_rules: "/home/daniel/compare/petclinic-evolve/astgrep-rules"

probe:
  enabled: true
  question: |
    Read the code as it currently stands and answer without changing anything.
    List, in order, every validation and side-effect that is applied when
    creating an owner via POST /api/owners.
  # Ground-truth items for a crude recall score (grade properly offline too):
  expected:
    - "telephone required"
    - "telephone digits"
    - "duplicate telephone"
    - "audit"
    - "registration date"

paths:
  work_root: /home/daniel/compare/petclinic-evolve/work
  results_csv: /home/daniel/compare/petclinic-evolve/results/records.csv
